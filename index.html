<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biodata Mahasiswa</title>

<style>

body{
    margin:0;
    padding:0;
    height:100vh;
    font-family:Arial, sans-serif;
    background:linear-gradient(to right, #ffb6d9, #ffffff);
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:800px;
    background:white;
    border-radius:25px;
    padding:30px;
    display:flex;
    align-items:center;
    gap:40px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.foto img{
    width:250px;
    height:250px;
    object-fit:cover;
    border-radius:20px;
    border:5px solid pink;
}

.text{
    text-align:left;
}

.text h1{
    color:#ff4f9a;
    margin-bottom:20px;
}

.text p{
    font-size:20px;
    color:#444;
    margin:12px 0;
}

.text strong{
    color:#000;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    background:#ff4f9a;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:bold;
    transition:0.3s;
}

.btn:hover{
    background:#ff2c86;
}

</style>

</head>

<body>

<div class="card">

    <div class="foto">
        <img src="foto profil.jpeg" alt="Foto Profil">
    </div>

    <div class="text">

        <h1>Biodata Mahasiswa</h1>

        <p><strong>NPM :</strong> 2313034036</p>

            Lanjut ke Dashboard →

    </div>

</div>

</body>
</html>
