<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebGIS Rumah Sakit Kota Serang</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{height:100vh;overflow:hidden}
header{height:70px;background:#0d47a1;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.container{display:flex;height:calc(100vh - 70px)}
aside{width:320px;background:#fff;padding:15px;overflow:auto;border-right:1px solid #ddd}
.card{background:#f5f5f5;padding:12px;margin-bottom:10px;border-radius:8px;text-align:center}
#map{flex:1}
input,select,button{width:100%;padding:10px;margin-top:10px}
.dark{filter:invert(100%) hue-rotate(180deg)}
</style>
</head>
<body>
<header>
<h2>🩺 Sistem Informasi Persebaran Rumah Sakit Kota Serang</h2>
<button id="darkBtn">Dark Mode</button>
</header>

<div class="container">
<aside>
<div class="card"><b>Total RS</b><h2>12</h2></div>
<div class="card"><b>RS Kelas B</b><h2>4</h2></div>
<div class="card"><b>RS Kelas C</b><h2>7</h2></div>
<div class="card"><b>RS Kelas D</b><h2>1</h2></div>

<input type="text" id="search" placeholder="Cari Rumah Sakit">

<select id="filterKelas">
<option value="">Semua Kelas</option>
<option value="B">Kelas B</option>
<option value="C">Kelas C</option>
<option value="D">Kelas D</option>
</select>

<button onclick="getLocation()">📍 Lokasi Saya</button>
</aside>

<div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
var map=L.map('map').setView([-6.12,106.15],12);

var osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
var sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');

L.control.layers({"OSM":osm,"Satelit":sat}).addTo(map);

const rumahSakit=[
{nama:"RSUD Kota Serang",kelas:"C",jenis:"RSUD",lat:-6.121,lng:106.170},
{nama:"RSUD Banten",kelas:"B",jenis:"RSUD",lat:-6.111,lng:106.186},
{nama:"RSUD Dr. Drajat Prawiranegara",kelas:"B",jenis:"RSUD",lat:-6.118,lng:106.156},
{nama:"RS Achmad Wardi",kelas:"C",jenis:"RS Mata",lat:-6.142,lng:106.136},
{nama:"RS Benggala",kelas:"C",jenis:"RS Bedah",lat:-6.122,lng:106.161},
{nama:"RS Budi Asih",kelas:"C",jenis:"RS",lat:-6.115,lng:106.158},
{nama:"RS Fatimah",kelas:"D",jenis:"RS",lat:-6.152,lng:106.128},
{nama:"RS Ibunda Serang",kelas:"C",jenis:"RS",lat:-6.120,lng:106.150},
{nama:"RS Kencana Serang",kelas:"C",jenis:"RS",lat:-6.115,lng:106.165},
{nama:"RS Sari Asih Serang",kelas:"B",jenis:"RS",lat:-6.122,lng:106.173},
{nama:"RSIA Puri Garcia",kelas:"C",jenis:"RSIA",lat:-6.151,lng:106.127},
{nama:"RS Bhayangkara Tk IV Polda Banten",kelas:"B",jenis:"RSU",lat:-6.123,lng:106.160}
];

let markers=[];

function tampilkan(data){
markers.forEach(m=>map.removeLayer(m));
markers=[];

data.forEach(rs=>{
let m=L.marker([rs.lat,rs.lng]).addTo(map);
m.bindPopup("<b>"+rs.nama+"</b><br>Jenis: "+rs.jenis+"<br>Kelas: "+rs.kelas);
markers.push(m);
});
}
tampilkan(rumahSakit);

document.getElementById("search").addEventListener("keyup",function(){
let k=this.value.toLowerCase();
tampilkan(rumahSakit.filter(r=>r.nama.toLowerCase().includes(k)));
});

document.getElementById("filterKelas").addEventListener("change",function(){
if(this.value===""){tampilkan(rumahSakit);return;}
tampilkan(rumahSakit.filter(r=>r.kelas===this.value));
});

function getLocation(){
navigator.geolocation.getCurrentPosition(function(pos){
L.marker([pos.coords.latitude,pos.coords.longitude]).addTo(map).bindPopup("Lokasi Anda").openPopup();
map.setView([pos.coords.latitude,pos.coords.longitude],15);
});
}

document.getElementById("darkBtn").onclick=()=>document.body.classList.toggle("dark");
</script>
</body>
</html>
